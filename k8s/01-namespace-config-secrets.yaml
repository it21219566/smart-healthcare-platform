apiVersion: v1
kind: Namespace
metadata:
  name: smart-healthcare
---
apiVersion: v1
kind: Secret
metadata:
  name: healthcare-secrets
  namespace: smart-healthcare
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password123"
  JWT_SECRET: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
  INITIAL_ADMIN_EMAIL: "admin@smarthealth.lk"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-config
  namespace: smart-healthcare
data:
  SPRING_ACTIVEMQ_BROKER_URL: "tcp://activemq:61616"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  PATIENT_SERVICE_URL: "http://patient-service:8082"
  DOCTOR_SERVICE_URL: "http://doctor-service:8083"
  APPOINTMENT_SERVICE_URL: "http://appointment-service:8084"
  init-databases.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE patient_db;
    CREATE DATABASE doctor_db;
    CREATE DATABASE appointment_db;
