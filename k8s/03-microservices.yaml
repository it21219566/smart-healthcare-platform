# 1. Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: smarthealth/auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/auth_db"
            - name: INITIAL_ADMIN_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: healthcare-secrets
          resources:
            limits:
              memory: "350Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: smart-healthcare
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
