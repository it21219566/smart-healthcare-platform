server:
  port: 8085

spring:
  application:
    name: notification-service
  activemq:
    broker-url: ${SPRING_ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ACTIVEMQ_USER:admin}
    password: ${SPRING_ACTIVEMQ_PASSWORD:admin}
  jms:
    listener:
      concurrency: 1
      max-concurrency: 2
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notification:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_USERNAME:noreply@smarthealth.lk}
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:notifylk} # Options: notifylk | twilio
    notifylk:
      user-id: ${NOTIFYLK_USER_ID:}
      api-key: ${NOTIFYLK_API_KEY:}
      sender-id: ${NOTIFYLK_SENDER_ID:NotifyDEMO}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}