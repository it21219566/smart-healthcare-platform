server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}

app:
  security:
    initial-admin:
      # Opt-in provisioning: set INITIAL_ADMIN_ENABLED=false in production after initial bootstrap
      enabled: ${INITIAL_ADMIN_ENABLED:true}
      email: ${INITIAL_ADMIN_EMAIL:admin@smarthealth.lk}
      # Never hardcode a fallback password here; if blank, AdminBootstrapService generates a CSPRNG password
      password: ${INITIAL_ADMIN_PASSWORD:}